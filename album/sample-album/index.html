<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Album — Keshia's Journal</title>
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<div class="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="../../index.html">Keshia's Journal</a>
    <div class="nav-links">
      <a class="nav-link" href="../../index.html">Home</a>
      <a class="nav-link is-active" href="../../albums.html">Albums</a>
      <a class="nav-link" href="../../about.html">About</a>
    </div>
  </div>
</div>
<div class="wrap">
  <a class="back-link" href="../../albums.html">← all albums</a>
  <div class="album-header">
    <h1 class="album-title" style="color:var(--orange)">Sample Album</h1>
    <span class="album-date-badge">Month Year</span>
  </div>
  <p class="album-excerpt">A one or two sentence description of this album. Shown under the title on the homepage, the Albums page, and this album's own page.</p>
<div class="masonry">
    <div class="masonry-item js-lightbox-item" data-caption="an example caption under a photo" data-full="../../photos/albums/sample-album/photo-1.svg">
      <div class="masonry-photo"><img src="../../photos/albums/sample-album/photo-1.svg" alt="an example caption under a photo" loading="lazy"></div>
      <p class="masonry-caption">an example caption under a photo</p>
    </div>
    <div class="masonry-item js-lightbox-item" data-caption="" data-full="../../photos/albums/sample-album/photo-2.svg">
      <div class="masonry-photo"><img src="../../photos/albums/sample-album/photo-2.svg" alt="" loading="lazy"></div>
      
    </div>
    <div class="masonry-item js-lightbox-item" data-caption="" data-full="../../photos/albums/sample-album/photo-3.svg">
      <div class="masonry-photo"><img src="../../photos/albums/sample-album/photo-3.svg" alt="" loading="lazy"></div>
      
    </div>
    <div class="masonry-item js-lightbox-item" data-caption="captions are optional — most photos won't have one" data-full="../../photos/albums/sample-album/photo-4.svg">
      <div class="masonry-photo"><img src="../../photos/albums/sample-album/photo-4.svg" alt="captions are optional — most photos won't have one" loading="lazy"></div>
      <p class="masonry-caption">captions are optional — most photos won't have one</p>
    </div>
    <div class="masonry-item js-lightbox-item" data-caption="" data-full="../../photos/albums/sample-album/photo-5.svg">
      <div class="masonry-photo"><img src="../../photos/albums/sample-album/photo-5.svg" alt="" loading="lazy"></div>
      
    </div>
    <div class="masonry-item js-lightbox-item" data-caption="" data-full="../../photos/albums/sample-album/photo-6.svg">
      <div class="masonry-photo"><img src="../../photos/albums/sample-album/photo-6.svg" alt="" loading="lazy"></div>
      
    </div>
    <div class="masonry-item js-lightbox-item" data-caption="" data-full="../../photos/albums/sample-album/photo-7.svg">
      <div class="masonry-photo"><img src="../../photos/albums/sample-album/photo-7.svg" alt="" loading="lazy"></div>
      
    </div>
  </div>
</div>
<div class="lightbox">
  <div class="lightbox-body">
    <div class="lightbox-photo"><img src="" alt=""></div>
    <p class="lightbox-caption"></p>
    <span class="lightbox-counter"></span>
  </div>
  <button class="lightbox-btn lightbox-close" aria-label="Close">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="4" x2="20" y2="20"></line><line x1="20" y1="4" x2="4" y2="20"></line></svg>
  </button>
  <button class="lightbox-btn lightbox-prev" aria-label="Previous photo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 6 9 12 15 18"></polyline></svg>
  </button>
  <button class="lightbox-btn lightbox-next" aria-label="Next photo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"></polyline></svg>
  </button>
</div>
<script src="../../assets/js/site.js"></script>
</body>
</html>
